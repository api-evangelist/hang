aid: hang
name: Hang
description: >-
  Hang is a customer loyalty and engagement platform (originally a Paradigm-backed
  Web3 brand-loyalty company, now positioned as an AI-driven "autonomous marketing
  system") used by restaurant, beauty, apparel, and e-commerce brands to build and
  run tier-based membership and rewards programs. Its Partner API powers program
  memberships, points and activities, quests, challenges, puzzles, loot/mystery
  boxes, rewards and redemptions, balance/gift cards, tokenized rewards, program
  tiers and segments, plus point-of-sale integrations with Toast and Square and
  real-time webhooks. Brands can embed a white-labeled rewards portal or drive the
  whole loyalty experience programmatically through the REST API.

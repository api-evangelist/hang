          in: path
          required: true
          description: the program membership id
      responses:
        '200':
          description: Returns rewards successfully
          schema:
            type: object
            properties:
              rewards:
                type: array
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      description: reward uuid
                    name:
                      type: string
                      description: reward name
                    redemption_instruction:
                      type: string
                      description: instructions on how to redeem the reward
                    redemption_method:
                      type: string

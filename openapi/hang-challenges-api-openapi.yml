      description: ''
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                challenge_type:
                  type: string
                  enum:
                  - purchase_streak
                  - game_win_streak
                  - menu_sampling_try_one
                  - menu_sampling_try_some
                  - menu_sampling_try_all
                  description: The type of challenge the streak encompasses.
                activity_type_ids:
                  type: array
                  items:
                    type: string
                  description: One or more activity types needed to be completed to complete the quest..
                starts_at:
                  type: number
                  description: When the challenge should start, in epoch seconds.
                ends_at:
                  type: number
                  description: When the challenge should end, in epoch seconds.
                program_segment_ids:
                  type: array
                  items:
                    type: string
                  description: "Which program segments (if any) the challenge\n       should apply to."
                prize_point_reward_value:
                  type: number
                  description: the amount of points to reward for completing the quest
                prize_loot_box_id:
                  type: string
                  description: the ID of a lootbox to reward for completing the quest
                prize_nft_loyalty_reward_id:
                  type: number
                  description: the ID of a reward to reward for completing the quest
                calendar_interval:
                  type: string
                  enum:
                  - daily
                  - weekly
                  - monthly
                  description: The interval of the streak.
                intervals_required_to_complete:
                  type: number
                  description: The number of intervals needed to complete the quest.
                value_threshold:
                  type: number
                  description: The value threshold to complete the requirement.
                max_num_of_completions_for_program:
                  type: number
                  description: The maximum number of times this quest can be completed for the program.
                restricted_to_ids:
                  type: array
                  items:
                    type: string
                  description: Menu item or group IDs to fulfill the requirements, array of comma-separated ids
          multipart/form-data:

openapi: 3.2.0
info:
  title: Hang Partner API (params in:formData) Challenges API
  description: 'The Partner API allows you to request various resources that can power your loyalty program.


    © Hang 2023'
  version: '1.0'
  x-copyright: '&copy Hang 2023'
servers:
- url: /partner-api
security:
- ApiKeyAuth: []
tags:
- name: Challenges
paths:
  /v2/admin/challenges:
    get:
      tags:
      - Challenges
      operationId: get_v2_admin_challenges
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  quest:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The Id of the quest.
                      name:
                        type: string
                        description: The name of the quest.
                      priority:
                        type: number
                        description: The display priority of the quest.
                      description:
                        type: string
                        description: A description of the quest.
                      sponsor_name:
                        type: string
                        description: The name of the quest sponsor.
                      image_url:
                        type: string
                        description: The url of the image for the quest.
                      point_threshold_requirement:
                        type: number
                        description: The threshhold for required number of points.
                      opt_in_text:
                        type: string
                        description: The text to display when opting in to a quest.
                      time_to_complete_minutes:
                        type: number
                        description: The amount of time a user has to complete the quest.
                      starts_at:
                        type: number
                        description: When the quest starts, in epoch seconds.
                      ends_at:
                        type: number
                        description: When the quest ends, in epoch seconds.
                      status:
                        type: string
                        enum:
                        - draft
                        - published
                        - archived
                        description: The status of the quest.
                      max_num_of_completions_per_user:
                        type: number
                        description: The maximum number of times a user can complete the quest.
                      max_num_of_completions_for_program:
                        type: number
                        description: The maximum number of times the quest can be completed for the program.
                      quest_type:
                        type: string
                        description: The type of quest.
                      auto_opt_in_at_signup:
                        type: boolean
                        description: Whether users should be automatically opted in to the quest at sign up.
                      partner_metadata:
                        type: object
                        additionalProperties: true
                        description: Set of key-value pairs that you can attach to a quest. This can be useful for storing additional information about the quest in a structured format.
                      created_at:
                        type: number
                        description: When the quest was created, in epoch seconds.
                      terms_and_conditions:
                        type: string
                        description: The terms and conditions of the quest.
                      auto_claim_prize:
                        type: boolean
                        description: Whether to automatically claim the prize when user completes the quest.
                      enforce_order:
                        type: boolean
                        description: Whether the steps of the quest need to be completed in order.
                      claim_prize_header_text:
                        type: string
                        description: Header text for claiming prize screen.
                      claim_prize_message:
                        type: string
                        description: Message text for claiming prize screen.
                      claim_prize_cta:
                        type: string
                        description: Call to action text for claiming prize
                      remaining_num_of_completions_for_program:
                        type: number
                        description: The number of quest completions remaining for the program.
                      quest_requirements:
                        type: array
                        items:
                          type: string
                      prize:
                        type: object
                        properties:
                          point_reward_value:
                            type: number
                            description: The amount of points, or any tier metric (e.g. xp, points, stars, etc), the user earns for claiming the prize.
                          sponsor_name:
                            type: string
                            description: Quest sponsor name.
                          lootbox:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier for the Lootbox object.
                              name:
                                type: string
                                description: Lootbox name.
                              description:
                                type: string
                                description: An arbitrary description attached to the Lootbox object. Often useful for displaying to users.
                              background_gradient_start_color:
                                type: string
                              background_gradient_stop_color:
                                type: string
                              image_box_together_url:
                                type: string
                              reward_choices:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: ID for lootbox reward choice.
                                    title:
                                      type: string
                                      description: Title for lootbox reward choice.
                                    subtitle:
                                      type: string
                                      description: Subtitle for lootbox reward choice.
                                    category:
                                      type: string
                                      description: Category for lootbox reward choice.
                                    point_reward_value:
                                      type: number
                                      description: Points for lootbox reward choice.
                                    reward_uuids:
                                      items:
                                        type: string
                                      type: array
                                      description: Reward UUIDs for the loot box reward choice.
                                    quantity:
                                      type: number
                                      description: Max amount of this loot box reward choice to be awarded.
                                    image:
                                      type: string
                                      description: Image for lootbox reward choice.
                                    video:
                                      type: string
                                      description: Video for lootbox reward choice.
                                    probability:
                                      type: number
                                      description: Probability for lootbox reward choice.
                                    current_tier_id:
                                      type: string
                                      description: Program tier this reward choice probability applies to.
                                    rewards:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          uuid:
                                            type: string
                                            description: Unique identifier for the Reward object.
                                          name:
                                            type: string
                                            description: Reward name.
                                          description:
                                            type: string
                                            description: An arbitrary description attached to the Reward object. Often useful for displaying to users.
                                          image_url:
                                            type: string
                                            description: An absolute URL of the reward's image.
                                          terms_and_conditions:
                                            type: string
                                            description: Terms and condition for the rewards.
                                          metadata:
                                            type: object
                                            additionalProperties: true
                                            description: Set of key-value pairs that you can attach to a reward. This can be useful for storing additional information about the quest in a structured format.
                                        additionalProperties: false
                                        required:
                                        - uuid
                                        - name
                                        - description
                                        - image_url
                                        - terms_and_conditions
                                        - metadata
                                  additionalProperties: false
                                  required:
                                  - id
                                  - title
                                  - subtitle
                                  - category
                                  - point_reward_value
                                  - reward_uuids
                                  - quantity
                                  - image
                                  - video
                                  - probability
                                  - current_tier_id
                                  - rewards
                              metadata:
                                type: object
                                additionalProperties: true
                                description: Set of key-value pairs that you can attach to a lootbox. This can be useful for storing additional information about the lootbox in a structured format.
                            additionalProperties: false
                            required:
                            - id
                            - name
                            - description
                            - background_gradient_start_color
                            - background_gradient_stop_color
                            - image_box_together_url
                            - reward_choices
                            - metadata
                          reward:
                            type: object
                            properties:
                              uuid:
                                type: string
                                description: Unique identifier for the Reward object.
                              name:
                                type: string
                                description: Reward name.
                              description:
                                type: string
                                description: An arbitrary description attached to the Reward object. Often useful for displaying to users.
                              image_url:
                                type: string
                                description: An absolute URL of the reward's image.
                              terms_and_conditions:
                                type: string
                                description: Terms and condition for the rewards.
                            additionalProperties: false
                            required:
                            - uuid
                            - name
                            - description
                            - image_url
                            - terms_and_conditions
                        additionalProperties: false
                        required:
                        - point_reward_value
                        - sponsor_name
                        - lootbox
                        - reward
                    additionalProperties: false
                    required:
                    - id
                additionalProperties: false
                required:
                - quest
      description: ''
      summary: Get v2 admin challenges
      x-summary-source: derived

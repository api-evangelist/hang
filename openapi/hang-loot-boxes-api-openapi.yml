  /v2/program-memberships/{program_membership_id}/loot-boxes:
    get:
      tags:
      - Loot Boxes
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      operationId: get_v2_program-memberships_program_membership_id_loot-boxes
      summary: Endpoint to fetch all loot boxes for a program membership
      parameters:
      - name: program_membership_id
        type: string
        in: path
        required: true
        description: the program membership id
      responses:
        '200':
          description: Successful response
          schema:
            type: object
            properties:
              allocated_loot_boxes:
                type: array
                items:
                  type: object
                  properties:
                    loot_box_id:
                      type: string
                      description: Unique identifier for the Lootbox object.
                    name:
                      type: string
                      description: Name/title of the Lootbox object.
                    description:
                      type: string
                      description: description of the Lootbox object.
                    available_since:
                      type: number
                      description: When the lootbox became available, in epoch seconds.
                    redeemed_at:
                      type: number
                      description: When the lootbox was opened, in epoch seconds.
                    allocated_reward_choice:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the LootBoxRewardChoice object.
                        reward_uuid:
                          type: string
                          description: Unique identifier for the reward tied to the reward choice.
                        title:
                          type: string
                          description: A title for the LootBoxRewardChoice object.
                        subtitle:
                          type: string
                          description: A subtitle for the LootBoxRewardChoice object.
                        category:
                          type: string
                          description: A category for the LootBoxRewardChoice object.
                        point_reward_value:
                          type: number
                          description: The amount of points, or any tier metric (e.g. xp, points, stars, etc), the user has won.
                        image:
                          type: string
                          description: An absolute URL of the LootBoxRewardChoice's image.
                        reward_metadata:
                          type: object
                          additionalProperties: true
                          description: Set of key-value pairs that you can attach to a reward. This can be useful for storing additional information about the reward in a structured format.
                      additionalProperties: false
                      required:
                      - id
                      - reward_uuid
                      - title
                      - subtitle
                      - category
                      - point_reward_value
                      - image
                      - reward_metadata
                    reward_choices:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier for the LootBoxRewardChoice object.
                          reward_uuid:
                            type: string
                            description: Unique identifier for the reward tied to the reward choice.
                          probability:
                            type: number
                            description: The probability of winning the LootBoxRewardChoice.
                          title:
                            type: string
                            description: A title for the LootBoxRewardChoice object.
                          subtitle:

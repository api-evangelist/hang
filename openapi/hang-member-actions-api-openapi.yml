openapi: 3.2.0
info:
  title: Hang Partner API (params in:formData) Member Actions API
  description: 'The Partner API allows you to request various resources that can power your loyalty program.


    © Hang 2023'
  version: '1.0'
  x-copyright: '&copy Hang 2023'
servers:
- url: /partner-api
security:
- ApiKeyAuth: []
tags:
- name: Member Actions
paths:
  /v2/admin/program-memberships/{program_membership_id}/member-actions/grant-reward:
    post:
      tags:
      - Member Actions
      operationId: post_v2_admin_program-memberships_program_membership_id_member-actions_grant-reward
      summary: Endpoint to grant a reward to a program membership
      parameters:
      - name: program_membership_id
        in: path
        required: true
        description: The program membership id
        schema:
          type: string
      responses:
        '200':
          description: ok
      description: ''
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                nft_loyalty_reward_uuid:
                  type: string
                  description: The uuid of the reward
              required:
              - nft_loyalty_reward_uuid
          multipart/form-data:
            schema:
              type: object
              properties:
                nft_loyalty_reward_uuid:
                  type: string
                  description: The uuid of the reward
              required:
              - nft_loyalty_reward_uuid
  /v2/admin/program-memberships/{program_membership_id}/member-actions/grant-loot-box:
    post:
      tags:
      - Member Actions
      operationId: post_v2_admin_program-memberships_program_membership_id_member-actions_grant-loot-box
      summary: Endpoint to grant a loot box to a program membership
      parameters:
      - name: program_membership_id
        in: path
        required: true
        description: The program membership id
        schema:
          type: string
      responses:
        '200':
          description: ok
      description: ''
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                loot_box_id:
                  type: string
                  description: The id of the loot box
              required:
              - loot_box_id
          multipart/form-data:
            schema:
              type: object
              properties:
                loot_box_id:
                  type: string
                  description: The id of the loot box
              required:
              - loot_box_id
  /v2/admin/program-memberships/{program_membership_id}/member-actions/grant-points:
    post:
      tags:
      - Member Actions
      operationId: post_v2_admin_program-memberships_program_membership_id_member-actions_grant-points
      summary: Endpoint to grant points to a program membership
      parameters:
      - name: program_membership_id
        in: path
        required: true
        description: The program membership id
        schema:
          type: string
      responses:
        '200':
          description: ok
      description: ''
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                points:
                  type: number
                  description: The amount of points to grant
              required:
              - points
          multipart/form-data:
            schema:
              type: object
              properties:
                points:
                  type: number
                  description: The amount of points to grant
              required:
              - points
  /v2/admin/program-memberships/{program_membership_id}/member-actions/activity:
    post:
      tags:
      - Member Actions
      operationId: post_v2_admin_program-memberships_program_membership_id_member-actions_activity
      summary: Create a new activity synchronously
      parameters:
      - name: program_membership_id
        in: path
        required: true
        description: the program membership id
        schema:
          type: string
      responses:
        '200':
          description: Activity recorded for post-processing
      description: ''
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                activity[transaction_timestamp]:
                  type: number
                activity[value]:
                  type: string
                activity[activity_type_id]:
                  type: string
                idempotency_key:
                  type: string
                  description: used to prevent double-processing
                activity[line_items]:
                  type: array
                  items:
                    type: string
              required:
              - activity[transaction_timestamp]
              - activity[value]
              - activity[activity_type_id]
              - idempotency_key
          multipart/form-data:
            schema:
              type: object
              properties:
                activity[transaction_timestamp]:
                  type: number
                activity[value]:
                  type: string
                activity[activity_type_id]:
                  type: string
                idempotency_key:
                  type: string
                  description: used to prevent double-processing
                activity[line_items]:
                  type: array
                  items:
                    type: string
              required:
              - activity[transaction_timestamp]
              - activity[value]
              - activity[activity_type_id]
              - idempotency_key
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

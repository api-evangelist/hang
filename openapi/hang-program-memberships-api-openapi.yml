openapi: 3.2.0
info:
  title: Hang Partner API (params in:formData) Program memberships…
  description: 'The Partner API allows you to request various resources that can power your loyalty program.


    © Hang 2023'
  version: 2023.09.07
  x-copyright: '&copy Hang 2023'
servers:
- url: /partner-api
security:
- ApiKeyAuth: []
tags:
- name: Program memberships
paths:
  /v2/admin/program-memberships:
    get:
      tags:
      - Program memberships
      operationId: get_v2_admin_program-memberships
      summary: Get all program memberships
      parameters:
      - name: search_query
        in: query
        description: First name, last name, phone, or email of the users we want to look up.
        schema:
          type: string
      - name: offset
        in: query
        description: Index to start at.
        schema:
          type: number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  program_memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the program membership.
                        first_name:
                          type: string
                          description: First name of the user.
                        last_name:
                          type: string
                          description: Last name of the user.
                        email:
                          type: string
                          description: Email of the user.
                        phone:
                          type: string
                          description: Phone number of the user.
                        created_at:
                          type: number
                          description: When the membership was created, in epoch seconds.
                      additionalProperties: false
                      required:
                      - id
                      - first_name
                      - last_name
                      - email
                      - phone
                      - created_at
                  total_records:
                    type: number
                additionalProperties: false
                required:
                - program_memberships
                - total_records
      description: Program Memberships represent a member of the loyalty program. Includes user data. Sorted by creation date.
  /v2/admin/program-memberships/{program_membership_id}:
    get:
      tags:
      - Program memberships
      operationId: get_v2_admin_program-memberships_program_membership_id
      summary: Get the program membership with the specified Id
      parameters:
      - name: program_membership_id
        in: path
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  program_membership:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the program membership.
                      first_name:
                        type: string
                        description: First name of the user.
                      last_name:
                        type: string
                        description: Last name of the user.
                      email:
                        type: string
                        description: Email of the user.
                      phone:
                        type: string
                        description: Phone number of the user.
                      created_at:
                        type: number
                        description: When the membership was created, in epoch seconds.
                    additionalProperties: false
                    required:
                    - id
                    - first_name
                    - last_name
                    - email
                    - phone
                    - created_at
                additionalProperties: false
                required:
                - program_membership
      description: Program Membership represents a member of the loyalty program. Includes user data.
  /v2/admin/program_memberships/{program_membership_id}:
    patch:
      tags:
      - Program memberships
      operationId: patch_v2_admin_program_memberships_program_membership_id
      summary: Updates the program membership and associated user with the included fields
      parameters:
      - name: program_membership_id
        in: path
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  program_membership:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the program membership.
                      first_name:
                        type: string
                        description: First name of the user.
                      last_name:
                        type: string
                        description: Last name of the user.
                      email:
                        type: string
                        description: Email of the user.
                      phone:
                        type: string
                        description: Phone number of the user.
                      created_at:
                        type: number
                        description: When the membership was created, in epoch seconds.
                    additionalProperties: false
                    required:
                    - id
                    - first_name
                    - last_name
                    - email
                    - phone
                    - created_at
                additionalProperties: false
                required:
                - program_membership
      description: ''
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address of the user.
              required:
              - email
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address of the user.
              required:
              - email
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

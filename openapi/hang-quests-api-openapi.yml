                            image:
                              type: string
                              description: Image for lootbox reward choice.
                            probability:
                              type: number
                              description: Probability for lootbox reward choice.
                            reward:
                              type: object
                              properties:
                                uuid:
                                  type: string
                                  description: Unique identifier for the Reward object.
                                name:

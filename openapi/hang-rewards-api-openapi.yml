      - multipart/form-data
      operationId: post_v2_admin_rewards_batch-create
      summary: Endpoint to create a batch of rewards.
      parameters:
      - name: rewards
        type: array
        items:
          type: string
        in: formData
        required: true
        description: List of rewards to create.
      responses:
        '200':
          description: Successful response
          schema:
            type: object
            properties:
              rewards:
                type: array
                items:
                  type: string
                description: List of created rewards.
            additionalProperties: false
            required:
            - rewards
      description: ''

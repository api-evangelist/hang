      - multipart/form-data
      operationId: patch_v2_admin_rewards_batch-update
      summary: Endpoint to edit a batch of rewards.
      parameters:
      - name: rewards
        type: array
        items:
          type: string
        in: formData
        description: List of rewards to update.
      - name: reward_ids_to_delete
